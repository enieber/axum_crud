[package]
name = "axum_crud"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"]}
utoipa = "6.0.0"
