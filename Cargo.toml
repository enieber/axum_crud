[package]
name = "axum_crud"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"]}
utoipa = "6.0.0"
sea-orm = { version = "2.0.4", features = [ "sqlx-sqlite", "macros", "runtime-tokio-rustls", "with-chrono"] }
migration          = { path = "./migration" }
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
